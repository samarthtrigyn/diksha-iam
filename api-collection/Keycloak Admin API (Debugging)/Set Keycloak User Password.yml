info:
  name: Set Keycloak User Password
  type: http
  seq: 5

http:
  method: PUT
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/users/{{kcUserId}}/reset-password"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "password",
        "value": "NewPassword@123",
        "temporary": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Set password for Keycloak user directly (admin operation).
