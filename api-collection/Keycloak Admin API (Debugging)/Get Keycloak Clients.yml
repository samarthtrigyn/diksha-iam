info:
  name: Get Keycloak Clients
  type: http
  seq: 9

http:
  method: GET
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/clients"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List all clients configured in Keycloak realm.
