info:
  name: Get Keycloak Realm Info
  type: http
  seq: 8

http:
  method: GET
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get realm information from Keycloak.
