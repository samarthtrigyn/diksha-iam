info:
  name: Logout User from Keycloak
  type: http
  seq: 7

http:
  method: POST
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/users/{{kcUserId}}/logout"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Force logout of user from Keycloak (invalidates all sessions).
