info:
  name: List Keycloak Users
  type: http
  seq: 3

http:
  method: GET
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/users?max=50&first=0"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  params:
    - name: max
      value: "50"
      type: query
    - name: first
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List all users in Keycloak realm.
