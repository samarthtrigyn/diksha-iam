info:
  name: Get Keycloak Client Roles
  type: http
  seq: 10

http:
  method: GET
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/clients/{{kcClientId}}/roles"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get roles defined for a client in Keycloak.
