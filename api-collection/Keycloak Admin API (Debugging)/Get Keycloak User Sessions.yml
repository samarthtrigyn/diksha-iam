info:
  name: Get Keycloak User Sessions
  type: http
  seq: 6

http:
  method: GET
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/users/{{kcUserId}}/sessions"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get all active sessions for a user in Keycloak.
