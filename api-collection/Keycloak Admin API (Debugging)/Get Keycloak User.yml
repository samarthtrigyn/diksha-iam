info:
  name: Get Keycloak User
  type: http
  seq: 2

http:
  method: GET
  url: "{{keycloakUrl}}/admin/realms/{{keycloakRealm}}/users/{{kcUserId}}"
  headers:
    - name: Authorization
      value: Bearer {{kcAdminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get user details from Keycloak.
