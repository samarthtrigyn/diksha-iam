info:
  name: SSO Callback - Google
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/iam/sso/google/callback?code=AUTH_CODE&state=STATE"
  params:
    - name: code
      value: AUTH_CODE
      type: query
    - name: state
      value: STATE
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5

docs: |-
  Google OAuth callback endpoint. Handles authorization code and creates/updates user.

  **Always responds with a 302 redirect** to the frontend redirectUri with query params:
  - `status=SUCCESS` — authentication succeeded; fetch full result via GET /iam/sso/txn/:txnId/result
  - `status=ERROR` — authentication failed; fetch error details via GET /iam/sso/txn/:txnId/result
  - `status=CONFLICT` — account conflict; fetch conflict details via GET /iam/sso/txn/:txnId/result
  - `txnId` — transaction ID for result retrieval
  - `provider` — the SSO provider that was used

  **Note:** Disable "Follow Redirects" in client to see the raw 302 response.
