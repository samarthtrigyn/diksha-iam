info:
  name: Direct Grant Login - Bootstrap Check
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/iam/auth/login/direct-grant"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identifier": "rabrorayougra-3473@yopmail.com",
        "password": "",
        "clientId": "diksha-portal"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('HTTP 200', () => expect(res.getStatus()).to.equal(200));\r

        if (res.getStatus() === 200) {\r

        \    try {\r

        \        var jsonData = res.getBody();\r

        \        if (jsonData && jsonData.data) {\r

        \            if (jsonData.data.txnId) bru.setVar('txnId', jsonData.data.txnId);\r

        \            test('Status', () => expect(['PASSWORD_RESET_REQUIRED', 'LOGIN_USER']).to.include(jsonData.data.status));\r

        \            if (jsonData.data.status) bru.setVar('status', jsonData.data.status);\r

        \            if (jsonData.data.nextStep) bru.setVar('nextStep', jsonData.data.nextStep);\r

        \            if (jsonData.data.flow) bru.setVar('flow', jsonData.data.flow);\r

        \            if (jsonData.data.maskedIdentifier) bru.setVar('maskedIdentifier', jsonData.data.maskedIdentifier);\r

        \        }\r

        \        var tokens = (jsonData && jsonData.data && jsonData.data.tokens) || (jsonData && jsonData.tokens) || null;\r

        \        var user = (jsonData && jsonData.data && jsonData.data.user) || (jsonData && jsonData.user) || null;\r

        \        var sessionId = (jsonData && jsonData.data && jsonData.data.sessionId) || (jsonData && jsonData.sessionId) || null;\r

        \        if (tokens && tokens.accessToken) bru.setVar('accessToken', tokens.accessToken);\r

        \        if (tokens && tokens.refreshToken) bru.setVar('refreshToken', tokens.refreshToken);\r

        \        if (user && user.userId) bru.setVar('userId', user.userId);\r

        \        if (sessionId) bru.setVar('sessionId', sessionId);\r

        \    } catch (err) {\r

        \        console.log('Error parsing response:', err);\r

        \    }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "First-time legacy-user path: user exists in Cassandra but may be missing in upgraded Keycloak. Direct grant returns PASSWORD_RESET_REQUIRED with txnId for OTP/password setup when bootstrap is required."
