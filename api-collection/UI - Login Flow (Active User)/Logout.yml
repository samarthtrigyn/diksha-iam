info:
  name: Logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/iam/auth/logout"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('HTTP 200', () => expect(res.getStatus()).to.equal(200));\r

        if (res.getStatus() === 200) {\r

        \    try {\r

        \        var jsonData = res.getBody();\r

        \        test('Response body exists', () => expect(jsonData).to.not.equal(undefined));\r

        \    } catch (err) {\r

        \        console.log('Error parsing response:', err);\r

        \    }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Logout user and invalidate session. Clears httpOnly cookie.
