info:
  name: Registration - Complete
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/iam/auth/register/complete"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "txnId": "{{txnId}}",
        "password": "Test@123456",
        "confirmPassword": "Test@123456",
        "termsAccepted": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('HTTP 201', () => expect(res.getStatus()).to.equal(201));\r

        if (res.getStatus() === 201) {\r

        \    try {\r

        \        var jsonData = res.getBody();\r

        \        if (jsonData && jsonData.data) {\r

        \            if (jsonData.data.txnId) bru.setVar('txnId', jsonData.data.txnId);\r

        \            if (jsonData.data.status) bru.setVar('status', jsonData.data.status);\r

        \            if (jsonData.data.nextStep) bru.setVar('nextStep', jsonData.data.nextStep);\r

        \            if (jsonData.data.flow) bru.setVar('flow', jsonData.data.flow);\r

        \            if (jsonData.data.maskedIdentifier) bru.setVar('maskedIdentifier', jsonData.data.maskedIdentifier);\r

        \        }\r

        \        var user = (jsonData && jsonData.data && jsonData.data.user) || (jsonData && jsonData.user) || null;\r

        \        if (user && user.userId) bru.setVar('newUserId', user.userId);\r

        \    } catch (err) {\r

        \        console.log('Error parsing response:', err);\r

        \    }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Complete registration and create user in IAM DB and Keycloak. Returns user object with nextStep.
