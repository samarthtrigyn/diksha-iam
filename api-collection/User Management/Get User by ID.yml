info:
  name: Get User by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/iam/users/{{userId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get user profile by user ID. Requires valid access token.
