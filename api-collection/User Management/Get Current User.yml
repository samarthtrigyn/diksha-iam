info:
  name: Get Current User
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/iam/users/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get current authenticated user profile. Requires valid access token.
