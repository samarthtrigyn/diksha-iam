info:
  name: Get All Users
  type: http
  seq: 7

http:
  method: GET
  url: "{{iamCoreUrl}}/users?limit=50&offset=0"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  params:
    - name: limit
      value: "50"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get all users with pagination. Admin operation.
