info:
  name: Get User by Phone / Email / Username
  type: http
  seq: 3

http:
  method: GET
  url: "{{iamCoreUrl}}/users?email=samarth.nigam@trigyn.com"
  params:
    - name: email
      value: samarth.nigam@trigyn.com
      type: query
    - name: username
      value: ""
      type: query
      description: Lookup by username
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Found
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "userId": "usr_abc123",
            "username": "john_doe",
            "phone": "9899367094",
            "activationStatus": "ACTIVE"
          }

docs: Looks up a user by phone, email, or username query parameter. Use only one at a time.
