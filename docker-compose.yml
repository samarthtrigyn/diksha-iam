services:
  # PostgreSQL Database for Keycloak
  keycloak-postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diksha-demo

  # Keycloak 24 Identity Provider (custom build includes activation-token SPI)
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      
      # Admin Credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      
      # Hostname Configuration (for browser access)
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /
      
      # PROXY Configuration (for docker internal network)
      KC_PROXY: edge
      KC_PROXY_ADDRESS_FORWARDING: "true"

      # Shared secret for signing/verifying activation tokens
      # MUST match ACTIVATION_TOKEN_SECRET in iam-orchestrator
      ACTIVATION_TOKEN_SECRET: "diksha-activation-secret-change-in-production"
    
    command: start-dev --import-realm
    
    volumes:
      # Import realm on startup
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    
    ports:
      - "8080:8080"
    
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;grep 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
    
    networks:
      - diksha-demo

  # Redis Cache (for session/migration store)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diksha-demo

  # IAM Orchestrator Service (connects IAM User Service with Keycloak)
  iam-orchestrator:
    build:
      context: ./iam-orchestrator
      dockerfile: Dockerfile
    container_name: iam-orchestrator
    environment:
      NODE_ENV: development
      PORT: 4000
      
      # IAM User Service URL (assuming it's running on iam-service:3000)
      IAM_USER_SERVICE_URL: http://iam-service:3000
      
      # Orchestrator Base URL (assuming it's running on localhost:4000)
      ORCHESTRATOR_BASE_URL: http://localhost:4000
      
      # Keycloak URLs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: diksha-demo
      KEYCLOAK_ADMIN_CLIENT_ID: iam-admin-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: iam-admin-client-secret
      KEYCLOAK_PORTAL_CLIENT_ID: diksha-portal
      KEYCLOAK_MOBILE_CLIENT_ID: diksha-mobile
      
      # Keycloak public URL (browser-visible, differs from internal http://keycloak:8080)
      KEYCLOAK_PUBLIC_URL: http://localhost:8080

      # Frontend redirect URI
      FRONTEND_REDIRECT_URI: http://localhost:5173/auth/callback
      FRONTEND_BASE_URL: http://localhost:5173
      
      # Session/State Configuration
      STATE_STORE_TTL: 600000  # 10 minutes in ms
      
      # CORS Configuration
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      
      # Shared secret for signing activation tokens (must match Keycloak's ACTIVATION_TOKEN_SECRET)
      ACTIVATION_TOKEN_SECRET: "diksha-activation-secret-change-in-production"

      # Google OAuth Configuration (REQUIRED for Google SSO)
      GOOGLE_CLIENT_ID: "239632573042-k9ncnvvm13qgtrk5d33r822nahkpspgb.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "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"
      GOOGLE_JWKS_URL: "https://www.googleapis.com/oauth2/v1/certs"

      # Mock OTP Configuration (set to 'false' to use real OTP service)
      USE_MOCK_OTP: "true"
      MOCK_OTP_CODE: "123456"

      # Redis Configuration
      REDIS_URL: redis://redis:6379
    
    ports:
      - "4000:4000"
    
    depends_on:
      - keycloak
      - redis
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - diksha-demo
    
    # volumes for development (optional)
    volumes:
      - ./iam-orchestrator/src:/app/src

  # Demo Frontend (React + Vite)
  demo-frontend:
    build:
      context: ./web-portal
      dockerfile: Dockerfile.dev
    container_name: demo-frontend
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: diksha-demo
      VITE_KEYCLOAK_CLIENT_ID: diksha-portal
      VITE_ORCHESTRATOR_URL: http://localhost:4000
      VITE_FRONTEND_REDIRECT_URI: http://localhost:5173/auth/callback
    
    ports:
      - "5173:5173"
    
    depends_on:
      - iam-orchestrator
    
    networks:
      - diksha-demo
    
    # volumes for development (optional)
    volumes:
      - ./web-portal:/app
      - /app/node_modules

  # IAM User Service (Mock service for demonstration)
  iam-service:
    build:
      context: ./iam-core
      dockerfile: Dockerfile.dev
    container_name: iam-service
    environment:
      NODE_ENV: development
      PORT: 3000
      LOCATION_API_BASE_URL: https://dev.oci.diksha.gov.in
      LOCATION_API_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJkZUJyTmhjY2djNWNzUnh2ZU02Z2JYMWFuVTZxZGZyYiJ9.PggkeMJjWcV4MEy3J5XnizCCd6qcrFSD5y5rron_G9Y
      AES_KEY_BASE64: hX2RzN6YjlVZz8yTQ9kvlhRQmfzn6LxvlEJzjXsKjSo=
      LMS_SSO_BASE_URL: https://dev-learning.diksha.gov.in/diksha/diksha_sso.php
      INTERNAL_API_BASE_URL: https://dev.oci.diksha.gov.in
      OTP_REQUEST_TIMEOUT_MS: 10000
      SUNBIRD_ENCRYPTION_SALT: ing4eesue!wa7uKu
      CASSANDRA_CONTACT_POINTS: 10.50.8.60
      CASSANDRA_LOCAL_DC: datacenter1
