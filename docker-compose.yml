      GOOGLE_CLIENT_ID: 239632573042-k9ncnvvm13qgtrk5d33r822nahkpspgb.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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

    ports:
      - "3000:3000"
    
    volumes:
      - ./iam-core/src:/app/src
    
    networks:
      - diksha-demo
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  diksha-demo:
    driver: bridge

volumes:
  keycloak_postgres_data:
  redis_data:
